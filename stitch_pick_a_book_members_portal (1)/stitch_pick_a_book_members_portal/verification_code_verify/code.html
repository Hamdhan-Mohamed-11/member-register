<div class="w-full max-w-[360px] flex flex-col items-center">
<!-- Brand Logo Mark -->
<div class="flex flex-col items-center mb-space-lg">
<div class="w-14 h-14 rounded-xl bg-surface-container-low shadow-sm flex items-center justify-center p-2 mb-space-xs overflow-hidden">
<img alt="Pick a Book emblem" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UjT7AWSE90BT_3we0gsvspMHyuF3dA2XUP_iajSMcjj0vYfboNla7Y4ImcJu6jbOmU7ak8mf6Ktcton86BiQTeK5LC_-tzt2Av8kc3Q2T431foW9Lu_sb-8-0rOBWeatYvlWs6HsntQ9WfXosP9klIRrHITAfg5avJp0hlP9LsGnJaf-djFKozJyIBn-dcf6xrdzHjvLUHP0s8hEkc6k68iQdkcycUA1mNWUCucctwodznA5iRGsFD5GT7"/>
</div>
<span class="font-headline-sm text-headline-sm text-navy-deep tracking-tight">Pick a Book</span>
</div>
<!-- Main Card Container (Surface shifted with ambient shadow, no borders) -->
<div class="w-full bg-surface-card rounded-xl p-space-lg shadow-sm flex flex-col">
<!-- Eyebrow & Headline -->
<div class="text-center mb-space-md">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-gold-text mb-space-xs block font-semibold">
          SECURITY STEP
        </span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink-body mb-space-xs">
          Verify your email
        </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
          We sent a code to <span class="font-semibold text-ink-body">nimali@example.com</span>
</p>
<button class="font-label-sm text-label-sm text-sky-text hover:text-primary transition-colors mt-space-xs inline-flex items-center gap-1 mx-auto underline-offset-2 hover:underline" type="button">
<span>Wrong email?</span>
</button>
</div>
<!-- Error State Banner -->
<div class="mb-space-md bg-status-danger-bg text-status-danger-text rounded-lg p-space-sm flex items-start gap-2 text-left" role="alert">
<span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 0, 'wght' 300;">error</span>
<p class="font-body-sm text-body-sm leading-tight font-medium">
          Invalid verification code. Please check your inbox and try again.
        </p>
</div>
<!-- 6-Digit OTP Field Container -->
<form class="w-full flex flex-col" onsubmit="event.preventDefault();">
<div class="flex justify-between items-center w-full mb-space-lg gap-1.5" id="otp-container">
<input aria-label="Digit 1" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="5"/>
<input aria-label="Digit 2" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="8"/>
<input aria-label="Digit 3" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="2"/>
<input aria-label="Digit 4" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="9"/>
<input aria-label="Digit 5" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="1"/>
<input aria-label="Digit 6" class="w-11 h-12 text-center text-ink-body font-headline-sm text-headline-sm rounded-lg bg-surface-container-low focus:bg-surface-card focus:shadow-md outline-none transition-all duration-150" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="4"/>
</div>
<!-- Primary Verification CTA -->
<button class="w-full h-12 bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center shadow-sm hover:bg-navy-deep active:scale-[0.99] transition-all mb-space-md" type="submit">
          Verify &amp; Continue
        </button>
<!-- Disabled Countdown State for Resend -->
<div class="flex items-center justify-center gap-1.5 text-ink-faint py-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0, 'wght' 300;">hourglass_empty</span>
<span class="font-body-sm text-body-sm font-medium">Resend code in <span class="tabular-nums font-semibold text-ink-faint">24s</span></span>
</div>
</form>
</div>
<!-- Back to Join Society Link -->
<div class="mt-space-lg text-center">
<button class="inline-flex items-center gap-1.5 font-label-md text-label-md text-navy-deep hover:text-primary transition-colors py-2 px-space-sm rounded-lg hover:bg-navy-wash" type="button">
<span>← Back to Join</span>
</button>
</div>
<!-- Micro Literary Quote Accent -->
<div class="mt-space-xl text-center px-space-md">
<p class="font-headline-sm text-caption italic text-ink-faint leading-relaxed">
        “A reader lives a thousand lives before he dies.”
      </p>
<span class="block font-caption text-caption text-ink-faint uppercase tracking-wider mt-1 text-[10px]">
        Pick a Book Reading Society
      </span>
</div>
</div>
</div>
<script>
  (function() {
    const inputs = document.querySelectorAll('#otp-container input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
  })();
</script></main></body></html>
